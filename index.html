<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FXT24.COM - Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1e40af;
            --secondary-color: #3b82f6;
            --accent-color: #f97316;
            --background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --text-dark: #1e293b;
            --text-light: #f1f5f9;
            --border-color: #cbd5e1;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .language-selector select {
            padding: 10px 15px;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            background-color: rgba(30, 64, 175, 0.1);
            color: var(--text-light);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .language-selector select:hover {
            background-color: rgba(30, 64, 175, 0.2);
            border-color: var(--accent-color);
        }

        .language-selector select option {
            background-color: var(--text-dark);
            color: var(--text-light);
        }

        .container {
            max-width: 900px;
            width: 100%;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(30, 64, 175, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.3));
            }
        }

        .status-badge {
            display: inline-block;
            padding: 12px 24px;
            background-color: rgba(249, 115, 22, 0.2);
            border: 2px solid var(--accent-color);
            border-radius: 30px;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .content-wrapper {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 50px;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out 0.2s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .content-wrapper h2 {
            color: var(--secondary-color);
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        .message-text {
            line-height: 1.8;
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 25px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-text p {
            margin-bottom: 15px;
        }

        .footer-signature {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--secondary-color);
            font-weight: 600;
            font-size: 16px;
        }

        .services-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(59, 130, 246, 0.05);
            border-left: 4px solid var(--secondary-color);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .services-info strong {
            color: var(--secondary-color);
        }

        /* RTL Support */
        body[dir="rtl"] {
            direction: rtl;
            text-align: right;
        }

        body[dir="rtl"] .language-selector {
            left: 20px;
            right: auto;
        }

        body[dir="rtl"] .message-text {
            direction: rtl;
            unicode-bidi: embed;
        }

        body[dir="rtl"] .services-info {
            border-left: none;
            border-right: 4px solid var(--secondary-color);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .content-wrapper {
                padding: 30px;
            }

            .logo {
                font-size: 36px;
            }

            .message-text {
                font-size: 15px;
                line-height: 1.7;
            }

            .container {
                max-width: 100%;
            }

            .header {
                margin-bottom: 30px;
            }

            .language-selector select {
                font-size: 13px;
                padding: 8px 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .content-wrapper {
                padding: 20px;
                border-radius: 12px;
            }

            .logo {
                font-size: 28px;
                letter-spacing: 1px;
            }

            .message-text {
                font-size: 14px;
            }

            .status-badge {
                padding: 10px 20px;
                font-size: 12px;
            }

            .language-selector {
                top: 10px;
                right: 10px;
            }
        }

        /* Decoration Elements */
        .decoration {
            position: fixed;
            pointer-events: none;
            opacity: 0.1;
        }

        .decoration-1 {
            top: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--secondary-color), transparent);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        .decoration-2 {
            bottom: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-color), transparent);
            border-radius: 50%;
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(30px);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body dir="ltr">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div class="language-selector">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="hi">हिंदी</option>
            <option value="ur">اردو</option>
            <option value="bn">বাংলা</option>
            <option value="ms">Bahasa Melayu</option>
            <option value="id">Bahasa Indonesia</option>
        </select>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">FXT24.COM</div>
            <div class="status-badge" id="statusBadge">Maintenance in Progress</div>
        </div>

        <div class="content-wrapper">
            <div id="content"></div>
        </div>
    </div>

    <script>
        const messages = {
            en: {
                statusBadge: "Maintenance in Progress",
                title: "Dear Valued Subscribers,",
                message: "Our website is currently undergoing scheduled updates to improve your experience. During this time, the site will be temporarily unavailable.\n\nPlease note that all our services remain fully available through our other platforms; only the website is affected during this maintenance period.\n\nWe appreciate your patience and understanding as we work to enhance our platform.",
                closing: "Thank you for your continued support.",
                signature: "Sincerely,\nFXT24.COM",
                servicesInfo: "✓ All Services Available: Our mobile apps, APIs, and partner platforms continue to operate normally during this maintenance window."
            },
            ar: {
                statusBadge: "الصيانة قيد التقدم",
                title: "السادة المشتركون الكرام،",
                message: "يخضع موقعنا حاليًا لتحديثات مجدولة لتحسين تجربتكم. خلال هذه الفترة، سيكون الموقع غير متاح مؤقتًا.\n\nيرجى ملاحظة أن جميع خدماتنا لا تزال متاحة بالكامل عبر منصاتنا الأخرى؛ الموقع فقط هو المتأثر خلال فترة الصيانة.\n\nنقدّر صبركم وتفهمكم بينما نعمل على تحسين منصتنا.",
                closing: "شكرًا لدعمكم المستمر.",
                signature: "مع خالص التحية،\nFXT24.COM",
                servicesInfo: "✓ جميع الخدمات متاحة: تواصل تطبيقاتنا الجوالة وواجهات برمجية التطبيقات ومنصات الشركاء بالعمل بشكل طبيعي خلال نافذة الصيانة هذه."
            },
            hi: {
                statusBadge: "रखरखाव चल रहा है",
                title: "प्रिय सम्मानित ग्राहकों,",
                message: "हमारी वेबसाइट वर्तमान में आपके अनुभव को बेहतर बनाने के लिए निर्धारित अपडेट के अधीन है। इस दौरान, वेबसाइट अस्थायी रूप से उपलब्ध नहीं होगी।\n\nकृपया ध्यान दें कि हमारी सभी सेवाएँ हमारे अन्य प्लेटफॉर्म पर पूरी तरह उपलब्ध हैं; इस अवधि में केवल वेबसाइट प्रभावित है।\n\nहम आपके धैर्य और समझ की सराहना करते हैं क्योंकि हम अपने प्लेटफॉर्म को बेहतर बना रहे हैं।",
                closing: "आपके निरंतर समर्थन के लिए धन्यवाद।",
                signature: "सादर,\nFXT24.COM",
                servicesInfo: "✓ सभी सेवाएं उपलब्ध: हमारे मोबाइल ऐप्स, API और पार्टनर प्लेटफॉर्म इस रखरखाव अवधि के दौरान सामान्य रूप से काम करते रहते हैं।"
            },
            ur: {
                statusBadge: "سرانجام جاری ہے",
                title: "محترم معزز صارفین،",
                message: "ہماری ویب سائٹ اس وقت آپ کے تجربے کو بہتر بنانے کے لیے شیڈول اپڈیٹس سے گزر رہی ہے۔ اس دوران ویب سائٹ عارضی طور پر دستیاب نہیں ہوگی۔\n\nبراہِ کرم نوٹ کریں کہ ہماری تمام خدمات ہمارے دیگر پلیٹ فارمز پر مکمل طور پر دستیاب ہیں؛ اس مدت میں صرف ویب سائٹ متاثر ہے۔\n\nہم آپ کے صبر اور سمجھ کی قدر کرتے ہیں جبکہ ہم اپنے پلیٹ فارم کو بہتر بنا رہے ہیں۔",
                closing: "آپ کی مسلسل حمایت کا شکریہ۔",
                signature: "مخلص،\nFXT24.COM",
                servicesInfo: "✓ تمام خدمات دستیاب: ہماری موبائل ایپس، APIs اور پارٹنر پلیٹ فارمز اس دیکھ بھال کی مدت میں عام طور پر کام کرتے رہتے ہیں۔"
            },
            bn: {
                statusBadge: "রক্ষণাবেক্ষণ চলমান",
                title: "প্রিয় সম্মানিত গ্রাহকবৃন্দ,",
                message: "আপনাদের অভিজ্ঞতা উন্নত করার জন্য আমাদের ওয়েবসাইটে বর্তমানে নির্ধারিত আপডেট চলছে। এই সময়ে ওয়েবসাইটটি সাময়িকভাবে বন্ধ থাকবে।\n\nদয়া করে লক্ষ্য করুন, আমাদের সকল সেবা অন্যান্য প্ল্যাটফর্মে সম্পূর্ণরূপে উপলব্ধ রয়েছে; এই সময়ে শুধুমাত্র ওয়েবসাইটটি প্রভাবিত হচ্ছে।\n\nআমরা আমাদের প্ল্যাটফর্ম উন্নত করার সময় আপনার ধৈর্য ও বোঝাপড়ার জন্য কৃতজ্ঞ।",
                closing: "আপনার অব্যাহত সমর্থনের জন্য ধন্যবাদ।",
                signature: "সশ্রদ্ধ,\nFXT24.COM",
                servicesInfo: "✓ সকল সেবা উপলব্ধ: আমাদের মোবাইল অ্যাপ্লিকেশন, API এবং অংশীদার প্ল্যাটফর্মগুলি এই রক্ষণাবেক্ষণ সময়ে সাধারণত কাজ করতে থাকে।"
            },
            ms: {
                statusBadge: "Penyelenggaraan Sedang Berlangsung",
                title: "Pelanggan yang dihargai,",
                message: "Laman web kami kini sedang menjalani kemas kini berjadual untuk meningkatkan pengalaman anda. Sepanjang tempoh ini, laman web akan tidak tersedia buat sementara waktu.\n\nSila ambil perhatian bahawa semua perkhidmatan kami masih tersedia sepenuhnya melalui platform lain; hanya laman web yang terjejas sepanjang tempoh penyelenggaraan ini.\n\nKami menghargai kesabaran dan pemahaman anda semasa kami menambah baik platform kami.",
                closing: "Terima kasih atas sokongan berterusan anda.",
                signature: "Yang benar,\nFXT24.COM",
                servicesInfo: "✓ Semua Perkhidmatan Tersedia: Aplikasi mudah alih, API dan platform rakan kami terus beroperasi dengan normal sepanjang tetingkap penyelenggaraan ini."
            },
            id: {
                statusBadge: "Pemeliharaan Berlangsung",
                title: "Pelanggan yang terhormat,",
                message: "Situs web kami saat ini sedang menjalani pembaruan terjadwal untuk meningkatkan pengalaman Anda. Selama waktu ini, situs akan tidak tersedia untuk sementara.\n\nHarap diperhatikan bahwa semua layanan kami tetap tersedia sepenuhnya melalui platform lainnya; hanya situs web yang terdampak selama masa pemeliharaan ini.\n\nKami menghargai kesabaran dan pengertian Anda saat kami meningkatkan platform kami.",
                closing: "Terima kasih atas dukungan Anda yang berkelanjutan.",
                signature: "Hormat kami,\nFXT24.COM",
                servicesInfo: "✓ Semua Layanan Tersedia: Aplikasi mobile, API, dan platform mitra kami terus beroperasi dengan normal selama jendela pemeliharaan ini."
            }
        };

        const rtlLanguages = ['ar', 'ur'];
        
        const countryLanguageMap = {
            'SA': 'ar', 'AE': 'ar', 'EG': 'ar', 'DZ': 'ar', 'MA': 'ar', 'JO': 'ar', 'IL': 'ar', 'LB': 'ar', 'SY': 'ar', 'IQ': 'ar', 'KW': 'ar', 'QA': 'ar', 'BH': 'ar', 'OM': 'ar', 'YE': 'ar', 'PS': 'ar', 'TN': 'ar', 'LY': 'ar', 'SD': 'ar', 'MR': 'ar',
            'IN': 'hi', 'NP': 'hi',
            'PK': 'ur', 'AF': 'ur',
            'BD': 'bn',
            'MY': 'ms', 'SG': 'ms', 'BN': 'ms',
            'ID': 'id', 'TL': 'id',
            'US': 'en', 'GB': 'en', 'CA': 'en', 'AU': 'en', 'NZ': 'en', 'IE': 'en'
        };

        async function detectLanguageByIP() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                const countryCode = data.country_code;
                
                if (countryLanguageMap[countryCode]) {
                    return countryLanguageMap[countryCode];
                }
                
                const browserLang = (navigator.language || navigator.userLanguage).split('-')[0].toLowerCase();
                return messages[browserLang] ? browserLang : 'en';
            } catch (error) {
                console.error('IP Geolocation failed:', error);
                const browserLang = (navigator.language || navigator.userLanguage).split('-')[0].toLowerCase();
                return messages[browserLang] ? browserLang : 'en';
            }
        }

        function changeLanguage(lang) {
            localStorage.setItem('preferredLanguage', lang);
            renderContent(lang);
        }

        function renderContent(lang) {
            const msg = messages[lang];
            const isRTL = rtlLanguages.includes(lang);

            document.documentElement.lang = lang;
            document.body.dir = isRTL ? 'rtl' : 'ltr';

            document.getElementById('statusBadge').textContent = msg.statusBadge;

            const contentHTML = `
                <h2>${msg.title}</h2>
                <div class="message-text">${msg.message.split('\n').map(p => `<p>${p}</p>`).join('')}</div>
                <div class="services-info">${msg.servicesInfo}</div>
                <div class="message-text">${msg.closing}</div>
                <div class="footer-signature">${msg.signature.split('\n').map(line => `<div>${line}</div>`).join('')}</div>
            `;

            document.getElementById('content').innerHTML = contentHTML;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            let lang = localStorage.getItem('preferredLanguage');
            if (!lang) {
                lang = await detectLanguageByIP();
            }
            document.getElementById('languageSelect').value = lang;
            renderContent(lang);
        });
    </script>
</body>
</html>
